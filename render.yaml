# Render Blueprint: one web service + one PostgreSQL database.
# Deploy: Render dashboard -> New -> Blueprint -> select this repository. See README "Deployment".
services:
  - type: web
    name: assessment-platform
    runtime: python
    plan: free
    buildCommand: ./build.sh
    # Migrate, then serve. Gunicorn reads $PORT from Render.
    startCommand: python manage.py migrate --noinput && (python manage.py create_app_admin || true) && (python manage.py createsuperuser --noinput || true) && gunicorn config.wsgi:application --workers 2 --access-logfile - --error-logfile -
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true            # random, stored by Render, never in the repository
      - key: DJANGO_BEHIND_TLS_PROXY   # Render terminates TLS and sets X-Forwarded-Proto
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: assessment-db
          property: connectionString
      # First application ADMIN (the in-app console user; not staff, not superuser), created at start if these
      # are set and the username does not exist yet. It must change this password at first login.
      # Render asks for these values when the Blueprint is applied; they are never stored in the repository.
      - key: DJANGO_APP_ADMIN_USERNAME
        sync: false
      - key: DJANGO_APP_ADMIN_EMAIL
        sync: false
      - key: DJANGO_APP_ADMIN_PASSWORD
        sync: false
      # Optional: a Django superuser (Django admin site, emergencies only). Same rules as above.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # RENDER_EXTERNAL_HOSTNAME (set by Render) is added to ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS automatically.
      # For a custom domain also set DJANGO_ALLOWED_HOSTS and DJANGO_CSRF_TRUSTED_ORIGINS.

databases:
  - name: assessment-db
    plan: free
    databaseName: assessments
    user: assessments
