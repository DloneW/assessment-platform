<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Assessment Platform{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1f2933; }
    header { background: #1f3a5f; color: #fff; padding: .75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    main { max-width: 520px; margin: 2rem auto; background: #fff; padding: 1.5rem 2rem; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    label { display: block; margin-top: .9rem; font-weight: 600; }
    input, select { width: 100%; padding: .5rem; margin-top: .25rem; box-sizing: border-box; }
    button { margin-top: 1.2rem; padding: .6rem 1.2rem; background: #1f3a5f; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    .errorlist { color: #b42318; list-style: none; padding: 0; margin: .25rem 0 0; font-size: .9rem; }
    .messages { list-style: none; padding: 0; }
    .messages li { background: #e6f4ea; padding: .5rem .75rem; border-radius: 4px; margin-bottom: .5rem; }
    .help { color: #52606d; font-size: .8rem; }
    dl dt { font-weight: 600; margin-top: .8rem; }
    dl dd { margin: 0; }
    form.inline { display: inline; }
    form.inline button { margin: 0; }
  </style>
</head>
<body>
  <header>
    <a href="/">Assessment Platform</a>
    {% if user.is_authenticated %}
      <form class="inline" method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit">Log out</button>
      </form>
    {% endif %}
  </header>
  <main>
    {% if messages %}
      <ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
